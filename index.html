<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shifter Trades — ICT Trading Community</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="description" content="Shifter Trades: komunitas belajar trading dengan konsep ICT. Gabung Discord dan ikuti semua kanal kami.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Tandai halaman berjalan dengan JS (CSS menyembunyikan konten sampai animasi siap).
   Pengaman: jika script utama gagal, konten tetap ditampilkan setelah 2,5 detik. */
document.documentElement.classList.add("js");
setTimeout(function(){ var p = document.querySelector(".page"); if (p) p.classList.add("ready"); }, 2500);
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="top"></div>
  <main>
    <section class="profile">
      <!-- Cover (opsional): taruh file bernama cover.gif / cover.png / cover.jpg / cover.webp / cover.mp4 dll. di folder yang sama -->
      <div class="cover rv" aria-hidden="true"></div>
      <div class="avatar rv">
        <!-- Foto profil: upload file bernama profile.png ke folder yang sama dengan index.html -->
        <img src="profile.png" alt="Foto profil Shifter Trades" width="160" height="160" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()">
        <svg aria-hidden="true" viewBox="0 0 30 30" fill="none" stroke="var(--text)" stroke-width="2.4" stroke-linecap="round"><path d="M7 19v4M7 9v6M15 15v8M15 6v5M23 12v11M23 4v4"/></svg>
      </div>
      <h1 class="rv" id="name"></h1>
      <p class="tag rv" id="tagline"></p>
      <p class="bio rv" id="bio"></p>
    </section>
    <section class="links" id="links" aria-label="Tautan"></section>
  </main>
  <footer class="rv">
    <p id="disclaimer"></p>
    <p id="copy"></p>
  </footer>
</div>

<script>
/* ============================================================
   KONFIGURASI — ubah di sini saja.
   enabled: true  → tampil
   enabled: false → disembunyikan
   ============================================================ */
const CONFIG = {
  name: "Shifter Trades",
  tagline: "ICT Trading Community",
  bio: "Learn ICT concepts, share market analysis, and grow through collective learning.",
  disclaimer: "Seluruh konten bersifat edukasi dan bukan saran keuangan. Trading memiliki risiko kerugian.",
  cover: "cover.gif",   // nama file cover. Kosongkan ("") agar otomatis mencari cover.gif/.webp/.png/.jpg/.jpeg/.avif/.svg/.mp4/.webm. Atau isi nama file sendiri, misal "banner.gif"

  primary: {
    key: "discord", enabled: true,
    label: "Join Discord Community",
    sub: "Diskusi, edukasi, dan live session",
    showSub: false,   // true = tampilkan teks kecil di bawah tombol, false = sembunyikan
    url: "https://discord.gg/your-invite"
  },
  groupLabel: "",   // isi teks (misal "Ikuti kami") untuk menampilkan judul di atas daftar link, kosongkan untuk menyembunyikan
  links: [
    { key: "youtube",   enabled: true,  label: "YouTube",   sub: "Educational Content", url: "https://youtube.com/@Shifter Trades" },
    { key: "instagram", enabled: true,  label: "Instagram", sub: "Daily Update", url: "https://instagram.com/Shifter Trades" },
    { key: "tiktok",    enabled: false,  label: "TikTok",    sub: "Tips singkat",  url: "https://tiktok.com/@Shifter Trades" },
    { key: "x",         enabled: false,  label: "X",         sub: "Catatan market", url: "https://x.com/Shifter Trades" },
    { key: "telegram",  enabled: false, label: "Telegram",  sub: "Pengumuman",    url: "https://t.me/Shifter Trades" },
    { key: "tradingview", enabled: false, label: "TradingView", sub: "Chart & ide", url: "https://tradingview.com/u/Shifter Trades" }
  ]
};

const ICONS = {
  discord: '<svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>',
  youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.6 6.7a4.8 4.8 0 0 1-3.8-4.2h-3.5v13.6a2.9 2.9 0 1 1-2-2.8V9.7a6.4 6.4 0 1 0 5.5 6.4V9.4a8.3 8.3 0 0 0 4.8 1.5V7.4a4.8 4.8 0 0 1-1-.7z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
  telegram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.5 3.5 2.8 10.7c-.9.4-.9 1.1-.2 1.3l4.8 1.5 1.8 5.6c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.4-2.3 4.8 3.5c.9.5 1.5.2 1.7-.8l3.2-15.1c.3-1.2-.4-1.8-1.3-1.4z"/></svg>',
  tradingview: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 8-9"/><path d="M14 6h6v6"/></svg>'
};
const GO = '<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const $ = id => document.getElementById(id);
  document.title = CONFIG.name + " — " + CONFIG.tagline;
  $("name").textContent = CONFIG.name;
  $("tagline").textContent = CONFIG.tagline;
  $("bio").textContent = CONFIG.bio;
  $("disclaimer").textContent = CONFIG.disclaimer;
  $("copy").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name;

  /* Class "rv" = ikut animasi masuk (lihat blok "Animasi masuk" di style.css) */
  let html = "";
  const p = CONFIG.primary;
  if (p.enabled) {
    html += '<a class="join rv" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer">' + ICONS[p.key] + esc(p.label) + '</a>' +
            (p.showSub && p.sub ? '<p class="join-sub rv">' + esc(p.sub) + '</p>' : '');
  }
  const rows = CONFIG.links.filter(l => l.enabled).map(l =>
    '<a class="row rv" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer">' +
    '<span class="ico">' + (ICONS[l.key] || ICONS.tradingview) + '</span>' +
    '<span class="txt"><strong>' + esc(l.label) + '</strong><span class="sub">' + esc(l.sub) + '</span></span>' + GO + '</a>'
  ).join("");
  if (rows) html += (CONFIG.groupLabel ? '<h2 class="group rv">' + esc(CONFIG.groupLabel) + '</h2>' : '') + '<div class="list">' + rows + '</div>';
  $("links").innerHTML = html;
  $("links").classList.toggle("no-sub", !(p.enabled && p.showSub && p.sub));
}
render();

/* ============================================================
   ANIMASI MASUK
   Konten ditahan (disembunyikan lewat CSS) sampai font dan cover siap, lalu muncul bertahap.
   Semua hal yang bisa mengubah layout (font, cover) diselesaikan SEBELUM animasi mulai,
   sehingga tidak ada kedipan atau lompatan saat animasi berjalan.
   Tiap tahap punya batas waktu, jadi halaman tidak pernah menunggu terlalu lama.
   ============================================================ */
const once = function(fn){ let done = false; return function(){ if (!done) { done = true; fn(); } }; };

/* Tahap 1: tunggu font (maksimal 500 ms) */
function fontsReady(cb){
  const fin = once(cb);
  setTimeout(fin, 500);
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load("400 1em Geist"),
      document.fonts.load("500 1em Geist"),
      document.fonts.load("600 1em Geist")
    ]).then(fin, fin);
  } else { fin(); }
}

/* Tahap 2: cek cover (opsional): gambar (gif, webp, png, jpg, jpeg, avif, svg) atau video (mp4, webm).
   Ruang cover dipesan lebih dulu (class has-cover) lalu gambarnya memudar masuk, jadi layout sudah final sebelum animasi mulai.
   Jika pengecekan lebih dari 700 ms, cover dianggap tidak ada di kunjungan ini. */
function coverStage(page, done){
  const finish = once(done);
  const box = document.querySelector(".cover");
  if (!box) { finish(); return; }
  let settled = false;   // true setelah ada/tidaknya cover diputuskan; hasil yang datang terlambat diabaikan
  setTimeout(function(){
    if (!settled) { settled = true; box.remove(); }
    finish();
  }, 700);

  const exts = ["gif","webp","png","jpg","jpeg","avif","svg","mp4","webm"];
  const names = CONFIG.cover ? [CONFIG.cover] : exts.map(function(e){ return "cover." + e; });
  const probe = function(n){
    return fetch(n, { method: "HEAD" })
      .then(function(r){ return r.ok && /^(image|video)\//.test(r.headers.get("content-type") || "") ? n : null; })
      .catch(function(){ return null; });
  };
  const show = function(src){
    const isVideo = /\.(mp4|webm)(\?.*)?$/i.test(src);
    const el = document.createElement(isVideo ? "video" : "img");
    if (isVideo) {
      el.muted = true; el.loop = true; el.autoplay = true; el.playsInline = true;
      el.setAttribute("playsinline", ""); el.setAttribute("muted", "");
    } else {
      el.alt = "";
    }
    page.classList.add("has-cover");
    box.appendChild(el);
    el.addEventListener(isVideo ? "loadeddata" : "load", function(){
      el.classList.add("in");
      if (isVideo) { const p = el.play(); if (p && p.catch) p.catch(function(){}); }
      finish();
    });
    el.addEventListener("error", function(){
      box.remove(); page.classList.remove("has-cover"); finish();
    });
    el.src = src;
  };
  Promise.all(names.map(probe)).then(function(found){
    if (settled) return;
    settled = true;
    const src = found.filter(Boolean)[0];
    if (src) show(src); else { box.remove(); finish(); }
  });
}

/* Mulai animasi: beri urutan (--i) pada elemen yang benar-benar ada, lalu nyalakan "ready".
   Cover dan foto profil memakai urutan yang sama supaya bergerak serempak. */
function reveal(page){
  let n = 0, last = 0;
  page.querySelectorAll(".rv").forEach(function(el){
    const prev = el.previousElementSibling;
    const withCover = el.classList.contains("avatar") && prev && prev.classList.contains("cover");
    last = withCover ? last : Math.min(n++, 8);
    el.style.setProperty("--i", last);
  });
  page.classList.add("ready");
}

(function(){
  const page = document.querySelector(".page");
  let need = 2;
  const step = function(){ if (--need === 0) reveal(page); };
  fontsReady(step);
  coverStage(page, step);
})();

/* Proteksi: blok zoom, copy, dan klik kanan */
(function(){
  var stop = function(e){ e.preventDefault(); };
  var opt = { passive: false };
  ["contextmenu","copy","cut","selectstart","dragstart"].forEach(function(t){ document.addEventListener(t, stop); });
  ["gesturestart","gesturechange","gestureend"].forEach(function(t){ document.addEventListener(t, stop, opt); });
  document.addEventListener("touchstart", function(e){ if (e.touches.length > 1) e.preventDefault(); }, opt);
  document.addEventListener("touchmove", function(e){ if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, opt);
  var last = 0;
  document.addEventListener("touchend", function(e){
    var now = Date.now();
    if (now - last <= 300) e.preventDefault();
    last = now;
  }, opt);
})();
</script>
</body>
</html>
